<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post — RailMate BD</title>
    <meta name="description" content="One Journey Board post from RailMate BD, with its comments, reactions and attachments." />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="post">
    <header class="site-header">
      <div class="wrap">
        <div class="brand"><span class="dot" aria-hidden="true"></span><a href="./">RailMate BD</a></div>
        <h1>Journey Board post</h1>
        <p>Shared from the RailMate BD app. Comments, likes and ratings shown here are the same rows the app shows.</p>
        <div class="header-actions">
          <a href="./">All posts</a>
          <a id="canonical" href="./">Permalink</a>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div id="status" class="status" hidden></div>
      <section id="post" aria-live="polite"></section>
      <section id="comments" class="comments" aria-label="Comments" aria-live="polite"></section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <strong>RailMate BD — demonstration prototype.</strong>
        <span>No real tickets, payments or reservations. Post ratings describe a post, never a person.</span>
      </div>
    </footer>

    <script src="assets/config.js"></script>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
